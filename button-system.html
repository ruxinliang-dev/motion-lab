<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Button system — Ruxin Liang</title><link rel="stylesheet" href="assets/site.css?v=228"><style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}main{max-width:1100px;margin:0 auto;padding:42px 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px;font:12px var(--mono)}a{color:inherit}h1{font-family:var(--font-display,var(--font));font-size:clamp(32px,5vw,56px);letter-spacing:-.04em;margin:0 0 18px;font-weight:800}p{color:var(--ink-2);font-size:17px;line-height:1.6;max-width:600px}.stage{height:clamp(320px,52vh,520px);position:relative;background:var(--surface);border-radius:32px;margin-top:32px;overflow:hidden}.modes{position:absolute;right:22px;top:20px;display:flex;gap:6px}.modes button{border:0;padding:8px 13px;border-radius:30px;font:12px var(--mono);color:var(--ink-3);background:transparent;cursor:pointer}.modes button[aria-pressed=true]{color:var(--c1);background:color-mix(in srgb,var(--c1) 12%,transparent)}.slot{position:absolute;top:50%;width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.2;transform:translate(-50%,-50%)}.demo{position:absolute;left:50%;top:50%;width:180px;height:74px;transform:translate(-50%,-50%);border:0;border-radius:24px;background:transparent;cursor:grab;touch-action:none;isolation:isolate;color:#00546f;font:600 17px var(--font);transition:left .75s cubic-bezier(.2,.8,.2,1),top .75s cubic-bezier(.2,.8,.2,1),scale .2s}.demo:focus-visible{outline:2px solid var(--c1);outline-offset:6px}.demo.down{scale:.96;cursor:grabbing}.demo.drag{transition:scale .2s}.demo svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible}.word{pointer-events:none}.caption{position:absolute;bottom:22px;left:24px;font:11px var(--mono);color:var(--ink-3)}.tone{display:none}.stage[data-mode=tone] .tone{display:block}.stage[data-mode=tone] .color{display:none}@media(prefers-reduced-motion:reduce){.demo{transition:none}}@media(max-width:500px){main{padding:24px 18px}.demo{width:140px;height:66px}.caption{max-width:220px;line-height:1.6}}
</style></head><body><main><header><span>Ruxin Liang / Button system</span><a href="index.html#/system/1">← Visual system</a></header><h1>A button, in motion.</h1><p>Click to move between positions. Drag to place it anywhere. Switch its visual language with Color or Tone.</p><div class="stage" data-mode="color"><div class="modes" aria-label="Button appearance"><button aria-pressed="true" data-mode="color">Color</button><button aria-pressed="false" data-mode="tone">Tone</button></div><i class="slot" style="left:22%"></i><i class="slot" style="left:50%"></i><i class="slot" style="left:78%"></i><button class="demo" aria-label="Move button to another position"><svg viewBox="0 0 180 74" preserveAspectRatio="none" aria-hidden="true"><defs><radialGradient id="mix" cx="50%" cy="50%" r="85%"><stop stop-color="#01b6ff" stop-opacity=".65"/><stop offset=".48" stop-color="#86c2d4" stop-opacity=".5"/><stop offset="1" stop-color="#01b6ff" stop-opacity=".10"/></radialGradient></defs><rect class="color" width="180" height="74" rx="24" fill="url(#mix)"/><g class="tone"></g></svg><span class="word">Move me ↗</span></button><span class="caption">Click: next position · drag: place</span></div></main><script>
const stage=document.querySelector('.stage'),button=document.querySelector('.demo'),gradient=document.querySelector('#mix'),tone=document.querySelector('.tone');let mode='color',slot=1,pressed=false,moved=false,start={x:0,y:0},origin={x:0,y:0},dots=[];
for(let row=0;row<19;row++)for(let col=0;col<45;col++){const x=col*4.3+(row%2)*2.15,y=row*3.72;if(x<3||x>177||y<3||y>71)continue;const dx=Math.max(24-x,0,x-156),dy=Math.max(24-y,0,y-50);if(dx*dx+dy*dy>21*21)continue;let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',1.15);c.setAttribute('fill','#01b6ff');c.setAttribute('opacity','.38');tone.appendChild(c);dots.push({c,x,y});}
function affect(e){let r=button.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*180,y=(e.clientY-r.top)/r.height*74;gradient.setAttribute('cx',x/180*100+'%');gradient.setAttribute('cy',y/74*100+'%');dots.forEach(d=>{let f=Math.exp(-((d.x-x)**2+(d.y-y)**2)/1000);d.c.setAttribute('r',1.15*(1-.65*f));d.c.setAttribute('opacity',.38+.15*f);});}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;stage.dataset.mode=mode;document.querySelectorAll('.modes button').forEach(v=>v.setAttribute('aria-pressed',v===b));});
button.addEventListener('pointerdown',e=>{pressed=true;moved=false;start={x:e.clientX,y:e.clientY};let a=stage.getBoundingClientRect(),b=button.getBoundingClientRect();origin={x:b.left+b.width/2-a.left,y:b.top+b.height/2-a.top};button.classList.add('down');button.setPointerCapture(e.pointerId);});
button.addEventListener('pointermove',e=>{affect(e);if(!pressed)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>5)moved=true;if(!moved)return;button.classList.add('drag');let r=stage.getBoundingClientRect(),bw=button.offsetWidth/2;button.style.left=Math.max(bw+12,Math.min(r.width-bw-12,origin.x+dx))+'px';button.style.top=Math.max(110,Math.min(r.height-65,origin.y+dy))+'px';});
function release(){pressed=false;button.classList.remove('down','drag');}
button.addEventListener('pointerup',release);button.addEventListener('pointercancel',()=>{moved=true;release();});button.addEventListener('click',()=>{if(moved)return;slot=(slot+1)%3;button.style.left='clamp('+ (button.offsetWidth/2+12)+'px,'+[22,50,78][slot]+'%,calc(100% - '+(button.offsetWidth/2+12)+'px))';button.style.top='50%';});button.addEventListener('pointerleave',()=>{gradient.setAttribute('cx','50%');gradient.setAttribute('cy','50%');dots.forEach(d=>{d.c.setAttribute('r',1.15);d.c.setAttribute('opacity','.38');});});
</script></body></html>
